<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#151b1d" />
    <script>
      // Reserve the compact cylinder layout before first paint; keep the full
      // readable sequence when JavaScript is disabled or HTML is prerendered.
      if (!window.__EMET_PRERENDER__) document.documentElement.dataset.processLayout = "compact";
    </script>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="preload" href="/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/images/design/home-commercial-mobile-900.avif"
      imagesrcset="/images/design/home-commercial-mobile-600.avif 600w, /images/design/home-commercial-mobile-900.avif 900w"
      imagesizes="max(100vw, 65vh)"
      type="image/avif"
      media="(max-width: 640px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/design/home-commercial-1600.avif"
      imagesrcset="/images/design/home-commercial-1600.avif 1600w, /images/design/home-commercial-2400.avif 2400w"
      imagesizes="100vw"
      type="image/avif"
      media="(min-width: 641px)"
      fetchpriority="high"
    />
    <meta
      name="google-site-verification"
      content="iHC44DTCGM1sB60mqcYoU3VtnwoA9V3hhcfyBySgC4g"
    />

    <!-- Public analytics identifiers. The failed Zyro tracker has been removed. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EWJCDYNTCG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-EWJCDYNTCG", { send_page_view: false });
      gtag("config", "AW-16887067533");
    </script>

  </head>
  <body>
    <div id="root"></div>

    <!-- Static copies let Netlify register both forms before React renders. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="business" />
      <input name="loanType" />
      <input name="loanAmount" />
      <textarea name="message"></textarea>
      <input name="transactionPurpose" />
      <input name="timing" />
      <input name="securityType" />
      <input name="securityLocation" />
      <input name="securityValue" />
      <input name="existingDebt" />
      <input name="repaymentPlan" />
      <input name="landingPath" />
      <input name="landingCategory" />
    </form>
    <form name="homepage-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="homepage-contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="business" />
      <input name="loanType" />
      <input name="loanAmount" />
      <textarea name="message"></textarea>
      <input name="transactionPurpose" />
      <input name="timing" />
      <input name="securityType" />
      <input name="securityLocation" />
      <input name="securityValue" />
      <input name="existingDebt" />
      <input name="repaymentPlan" />
      <input name="landingPath" />
      <input name="landingCategory" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
