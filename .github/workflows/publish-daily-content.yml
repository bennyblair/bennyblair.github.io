name: Validate manual content feed (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTENT_QA_BASE: origin/main
      SEO_MAX_ALLOWED_RISK: "R2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check pandas
      - name: Generate a disposable validation sample
        run: python scripts/publish_from_sot.py --csv data/emet_ai_feed_daily.csv --dry-run
      - name: Validate generated content without committing, pushing or opening a PR
        run: |
          npm run qa:content
          echo "Validation-only fallback completed. OpenClaw remains the sole production scheduler."
