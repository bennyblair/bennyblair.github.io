name: Auto-merge authorized SEO changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Verify scope and merge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >
      !github.event.pull_request.draft &&
      (
        github.event.pull_request.user.login == 'bennyblair' ||
        github.event.pull_request.user.login == 'github-actions[bot]'
      ) &&
      (
        (
          startsWith(github.event.pull_request.head.ref, 'ai/llm-upgrade-') &&
          contains(github.event.pull_request.labels.*.name, 'content-risk:low') &&
          contains(github.event.pull_request.labels.*.name, 'content-change:internal-links')
        ) ||
        (
          startsWith(github.event.pull_request.head.ref, 'ai/daily-content-') &&
          contains(github.event.pull_request.labels.*.name, 'seo-risk:R2') &&
          contains(github.event.pull_request.labels.*.name, 'automation-policy:daily-content-v1')
        )
      )
    steps:
      - name: Verify authorized scope and merge after the shared gate
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const allowedAuthors = new Set(['bennyblair', 'github-actions[bot]']);
            const requiredCheck = 'Type, content, security, build and route checks';
            const isDaily = pr.head.ref.startsWith('ai/daily-content-');
            const isInternalLinks = pr.head.ref.startsWith('ai/llm-upgrade-');

            if (!allowedAuthors.has(pr.user.login)) {
              core.setFailed(`Unexpected PR author: ${pr.user.login}`);
              return;
            }
            if (!isDaily && !isInternalLinks) {
              core.setFailed(`Unexpected branch: ${pr.head.ref}`);
              return;
            }

            const labels = new Set(pr.labels.map((label) => label.name));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (!files.length) {
              core.setFailed('The PR contains no files.');
              return;
            }

            if (isDaily) {
              for (const label of ['seo-risk:R2', 'automation-policy:daily-content-v1']) {
                if (!labels.has(label)) {
                  core.setFailed(`Missing required label: ${label}`);
                  return;
                }
              }
              const articles = files.filter((file) =>
                file.status === 'added' &&
                /^src\/content\/(?:guides|case-studies|insights)\/[^/]+\.md$/.test(file.filename));
              const proposals = files.filter((file) =>
                file.status === 'added' &&
                /^data\/seo-proposals\/prop_[a-f0-9]{32}\.json$/.test(file.filename));
              const fixed = new Map([
                ['data/seo-page-registry.json', 'modified'],
                ['data/seo-programs/index.json', 'modified'],
              ]);
              const allowed = new Set([
                ...articles.map((file) => file.filename),
                ...proposals.map((file) => file.filename),
                ...fixed.keys(),
              ]);
              if (articles.length !== 2 || proposals.length !== 2 || files.length !== 6) {
                core.setFailed(`Daily automation requires 2 articles, 2 proposals and 2 generated metadata files; found ${files.length} files.`);
                return;
              }
              for (const file of files) {
                if (!allowed.has(file.filename) || (fixed.has(file.filename) && file.status !== fixed.get(file.filename))) {
                  core.setFailed(`Auto-merge refused ${file.status} ${file.filename}.`);
                  return;
                }
              }
            } else {
              for (const label of ['content-risk:low', 'content-change:internal-links']) {
                if (!labels.has(label)) {
                  core.setFailed(`Missing required label: ${label}`);
                  return;
                }
              }
              const allowedPath = /^src\/content\/(?:guides|insights)\/[^/]+\.md$/;
              const internalRoute = String.raw`(?:https?:\/\/(?:www\.)?emetcapital\.com\.au)?\/(?:resources\/(?:guides|case-studies|insights)|services)\/[a-z0-9][a-z0-9\-/]*(?:[?#][^\s<>'"\)\]]*)?`;
              const markdownDestination = new RegExp(String.raw`(\]\(\s*)${internalRoute}(\s*(?:["'][^"']*["'])?\))`, 'gi');
              const htmlDestination = new RegExp(String.raw`(\bhref\s*=\s*["'])${internalRoute}(["'])`, 'gi');
              const referenceDestination = new RegExp(String.raw`^(\s*\[[^\]]+\]:\s*)${internalRoute}(\s*(?:["'][^"']*["'])?\s*)$`, 'gim');
              const normalizeInternalLinks = (source) => source
                .replace(/\r\n?/g, '\n')
                .replace(markdownDestination, '$1<internal-route>$2')
                .replace(htmlDestination, '$1<internal-route>$2')
                .replace(referenceDestination, '$1<internal-route>$2');
              async function readFile(path, ref) {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(response.data) || response.data.type !== 'file') throw new Error(`Could not read ${path} at ${ref}.`);
                return Buffer.from(response.data.content, 'base64').toString('utf8');
              }
              for (const file of files) {
                if (file.status !== 'modified' || !allowedPath.test(file.filename)) {
                  core.setFailed(`Auto-merge cannot modify ${file.filename}.`);
                  return;
                }
                const source = await readFile(file.filename, pr.head.sha);
                const previous = await readFile(file.filename, pr.base.sha);
                if (source === previous || normalizeInternalLinks(source) !== normalizeInternalLinks(previous)) {
                  core.setFailed(`${file.filename} is not an internal-link-destination-only change.`);
                  return;
                }
                const frontmatter = source.match(/^---\r?\n([\s\S]*?)\r?\n---/);
                if (!frontmatter || !/^contentRisk:\s*["']?low["']?\s*$/m.test(frontmatter[1])) {
                  core.setFailed(`${file.filename} is not explicitly contentRisk: low.`);
                  return;
                }
              }
            }

            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const gate = checks.find((check) => check.name === requiredCheck);
              if (gate?.status === 'completed') {
                if (gate.conclusion !== 'success') {
                  core.setFailed(`${requiredCheck} concluded ${gate.conclusion}.`);
                  return;
                }
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            const finalChecks = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const finalGate = finalChecks.find((check) => check.name === requiredCheck);
            if (finalGate?.conclusion !== 'success') {
              core.setFailed(`Timed out waiting for ${requiredCheck}.`);
              return;
            }
            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              sha: pr.head.sha,
              merge_method: 'squash',
              commit_title: pr.title,
            });
            if (!result.data.merged) core.setFailed(result.data.message || 'GitHub refused the merge.');
