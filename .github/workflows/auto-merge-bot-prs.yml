name: Auto-merge authorized SEO changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  # One publisher holds this lock through merge, live verification and any rollback.
  group: seo-production-publication
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Verify scope and merge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      !github.event.pull_request.draft &&
      (
        github.event.pull_request.user.login == 'bennyblair' ||
        github.event.pull_request.user.login == 'github-actions[bot]'
      ) &&
      (
        (
          startsWith(github.event.pull_request.head.ref, 'ai/llm-upgrade-') &&
          contains(github.event.pull_request.labels.*.name, 'content-risk:low') &&
          contains(github.event.pull_request.labels.*.name, 'content-change:internal-links')
        ) ||
        (
          startsWith(github.event.pull_request.head.ref, 'ai/daily-content-') &&
          contains(github.event.pull_request.labels.*.name, 'seo-risk:R2') &&
          contains(github.event.pull_request.labels.*.name, 'automation-policy:daily-content-v1')
        ) ||
        (
          startsWith(github.event.pull_request.head.ref, 'ai/content-repair-') &&
          contains(github.event.pull_request.labels.*.name, 'seo-risk:R2') &&
          contains(github.event.pull_request.labels.*.name, 'automation-policy:content-repair-v1')
        )
      )
    steps:
      - name: Checkout trusted base policy and verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up trusted verifier runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install trusted verifier dependencies
        run: npm ci --ignore-scripts

      - name: Verify authorized scope and merge after the shared gate
        id: merge_release
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const allowedAuthors = new Set(['bennyblair', 'github-actions[bot]']);
            const requiredCheck = 'Type, content, security, build and route checks';
            const isDaily = pr.head.ref.startsWith('ai/daily-content-');
            const isInternalLinks = pr.head.ref.startsWith('ai/llm-upgrade-');
            const isRepair = pr.head.ref.startsWith('ai/content-repair-');
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { validateRepairManifest, validateReleaseGate, REPAIR_MANIFEST } = await import(pathToFileURL(process.cwd() + '/scripts/lib/content-repair-policy.mjs').href);
            if (pr.base.ref !== 'main' || pr.head.repo?.full_name !== pr.base.repo?.full_name) {
              core.setFailed('Production automation requires a same-repository PR into main.');
              return;
            }
            async function readAt(file, ref) {
              const response = await github.rest.repos.getContent({ owner, repo, path: file, ref });
              if (Array.isArray(response.data) || response.data.type !== 'file') throw new Error('Cannot read ' + file);
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }

            if (!allowedAuthors.has(pr.user.login)) {
              core.setFailed(`Unexpected PR author: ${pr.user.login}`);
              return;
            }
            if (!isDaily && !isInternalLinks && !isRepair) {
              core.setFailed(`Unexpected branch: ${pr.head.ref}`);
              return;
            }

            const labels = new Set(pr.labels.map((label) => label.name));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (!files.length) {
              core.setFailed('The PR contains no files.');
              return;
            }

            if (isDaily) {
              for (const label of ['seo-risk:R2', 'automation-policy:daily-content-v1']) {
                if (!labels.has(label)) {
                  core.setFailed(`Missing required label: ${label}`);
                  return;
                }
              }
              const articles = files.filter((file) =>
                file.status === 'added' &&
                /^src\/content\/(?:guides|case-studies|insights)\/[^/]+\.md$/.test(file.filename));
              const proposals = files.filter((file) =>
                file.status === 'added' &&
                /^data\/seo-proposals\/prop_[a-f0-9]{32}\.json$/.test(file.filename));
              const articleImages = files.filter((file) =>
                file.status === 'added' &&
                /^public\/images\/articles\/[a-z0-9-]+\.webp$/.test(file.filename));
              const fixed = new Map([
                ['data/seo-page-registry.json', 'modified'],
                ['data/seo-programs/index.json', 'modified'],
              ]);
              const allowed = new Set([
                ...articles.map((file) => file.filename),
                ...articleImages.map((file) => file.filename),
                ...proposals.map((file) => file.filename),
                ...fixed.keys(),
              ]);
              if (articles.length !== 1 || articleImages.length !== 1 || proposals.length !== 1 || files.length !== 5) {
                core.setFailed(`Daily automation requires 1 article, 1 article image, 1 proposal and 2 generated metadata files; found ${files.length} files.`);
                return;
              }
              for (const file of files) {
                if (!allowed.has(file.filename) || (fixed.has(file.filename) && file.status !== fixed.get(file.filename))) {
                  core.setFailed(`Auto-merge refused ${file.status} ${file.filename}.`);
                  return;
                }
              }
            } else if (isRepair) {
              for (const label of ['seo-risk:R2', 'automation-policy:content-repair-v1']) {
                if (!labels.has(label)) { core.setFailed('Missing required label: ' + label); return; }
              }
              const manifests = files.filter(file => file.status === 'added' && REPAIR_MANIFEST.test(file.filename));
              if (manifests.length !== 1) { core.setFailed('Exactly one added repair manifest is required.'); return; }
              const manifest = JSON.parse(await readAt(manifests[0].filename, pr.head.sha));
              if (manifests[0].filename !== 'data/seo-repairs/' + manifest.repairId + '.json') { core.setFailed('Manifest filename does not match identity.'); return; }
              const changes = [];
              for (const file of files.filter(file => file.filename !== manifests[0].filename)) {
                if (file.status !== 'modified') { core.setFailed('Repair must modify existing content only.'); return; }
                changes.push({ file: file.filename, status: file.status, previous: await readAt(file.filename, pr.base.sha), current: await readAt(file.filename, pr.head.sha) });
              }
              const validation = validateRepairManifest({
                manifest,
                policy: JSON.parse(fs.readFileSync('data/seo-content-repair-policy.json', 'utf8')),
                registry: JSON.parse(fs.readFileSync('data/seo-page-registry.json', 'utf8')),
                protectedCohort: JSON.parse(fs.readFileSync('data/indexing-recovery-protected-pages.json', 'utf8')),
                changes,
                baseSha: pr.base.sha,
              });
              if (validation.errors.length) { core.setFailed(validation.errors.join('\n')); return; }
              core.summary.addHeading('Authorized repair release').addRaw(JSON.stringify({ repairId: manifest.repairId, baseSha: pr.base.sha, headSha: pr.head.sha, pages: validation.pages }, null, 2));
              await core.summary.write();
            } else {
              for (const label of ['content-risk:low', 'content-change:internal-links']) {
                if (!labels.has(label)) {
                  core.setFailed(`Missing required label: ${label}`);
                  return;
                }
              }
              const allowedPath = /^src\/content\/(?:guides|insights)\/[^/]+\.md$/;
              const internalRoute = String.raw`(?:https?:\/\/(?:www\.)?emetcapital\.com\.au)?\/(?:resources\/(?:guides|case-studies|insights)|services)\/[a-z0-9][a-z0-9\-/]*(?:[?#][^\s<>'"\)\]]*)?`;
              const markdownDestination = new RegExp(String.raw`(\]\(\s*)${internalRoute}(\s*(?:["'][^"']*["'])?\))`, 'gi');
              const htmlDestination = new RegExp(String.raw`(\bhref\s*=\s*["'])${internalRoute}(["'])`, 'gi');
              const referenceDestination = new RegExp(String.raw`^(\s*\[[^\]]+\]:\s*)${internalRoute}(\s*(?:["'][^"']*["'])?\s*)$`, 'gim');
              const normalizeInternalLinks = (source) => source
                .replace(/\r\n?/g, '\n')
                .replace(markdownDestination, '$1<internal-route>$2')
                .replace(htmlDestination, '$1<internal-route>$2')
                .replace(referenceDestination, '$1<internal-route>$2');
              async function readFile(path, ref) {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(response.data) || response.data.type !== 'file') throw new Error(`Could not read ${path} at ${ref}.`);
                return Buffer.from(response.data.content, 'base64').toString('utf8');
              }
              for (const file of files) {
                if (file.status !== 'modified' || !allowedPath.test(file.filename)) {
                  core.setFailed(`Auto-merge cannot modify ${file.filename}.`);
                  return;
                }
                const source = await readFile(file.filename, pr.head.sha);
                const previous = await readFile(file.filename, pr.base.sha);
                if (source === previous || normalizeInternalLinks(source) !== normalizeInternalLinks(previous)) {
                  core.setFailed(`${file.filename} is not an internal-link-destination-only change.`);
                  return;
                }
                const frontmatter = source.match(/^---\r?\n([\s\S]*?)\r?\n---/);
                if (!frontmatter || !/^contentRisk:\s*["']?low["']?\s*$/m.test(frontmatter[1])) {
                  core.setFailed(`${file.filename} is not explicitly contentRisk: low.`);
                  return;
                }
              }
            }

            const deadline = Date.now() + 20 * 60 * 1000;
            while (Date.now() < deadline) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const gate = checks.filter((check) => check.name === requiredCheck && check.app?.slug === 'github-actions').sort((a, b) => b.id - a.id)[0];
              if (gate?.status === 'completed') {
                if (gate.conclusion !== 'success') {
                  core.setFailed(`${requiredCheck} concluded ${gate.conclusion}.`);
                  return;
                }
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            const finalChecks = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const finalGate = finalChecks.filter((check) => check.name === requiredCheck && check.app?.slug === 'github-actions').sort((a, b) => b.id - a.id)[0];
            if (finalGate?.conclusion !== 'success') {
              core.setFailed(`Timed out waiting for ${requiredCheck}.`);
              return;
            }
            const latest = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
            if (latest.data.merged_at) {
              core.info(`PR #${pr.number} is already merged; its original publisher owns the release audit. This stale event will not execute another revision.`);
              return "";
            }
            if (latest.data.state !== 'open') {
              core.setFailed(`PR #${pr.number} closed without merging.`);
              return;
            }
            const gateErrors = validateReleaseGate({ expectedSha: pr.head.sha, actualSha: latest.data.head.sha, gate: finalGate });
            if (gateErrors.length || latest.data.draft) { core.setFailed(gateErrors.join('; ') || 'PR is now a draft.'); return; }
            const latestLabels = new Set(latest.data.labels.map(label => label.name));
            const requiredLabels = isRepair ? ['seo-risk:R2', 'automation-policy:content-repair-v1'] : isDaily ? ['seo-risk:R2', 'automation-policy:daily-content-v1'] : ['content-risk:low', 'content-change:internal-links'];
            if (requiredLabels.some(label => !latestLabels.has(label))) { core.setFailed('Authorization labels changed while waiting.'); return; }
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== pr.base.sha) { core.setFailed('Main advanced; rebase, refresh manifest evidence and rerun the shared gate.'); return; }
            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              sha: pr.head.sha,
              merge_method: 'squash',
              commit_title: pr.title,
            });
            if (!result.data.merged) {
              core.setFailed(result.data.message || 'GitHub refused the merge.');
              return '';
            }
            return result.data.sha;

      - name: Checkout the exact merged release
        if: steps.merge_release.outputs.result != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.merge_release.outputs.result }}
          fetch-depth: 0

      - name: Set up Node for the production contract
        if: steps.merge_release.outputs.result != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release-audit dependencies
        if: steps.merge_release.outputs.result != ''
        run: npm ci --ignore-scripts

      - name: Audit live pages and revert only deterministic defects
        if: steps.merge_release.outputs.result != ''
        id: live_contract
        env:
          CONTENT_RELEASE_AUDIT_ATTEMPTS: "8"
          CONTENT_RELEASE_AUDIT_DELAY_MS: "45000"
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run audit:live:content-release 2>&1 | tee content-release-audit.log
          code=$?
          set -e
          if [[ "$code" == "0" ]]; then
            exit 0
          fi
          if [[ "$code" != "10" ]]; then
            echo "Production infrastructure/deployment remained indeterminate; automatic revert is not authorized."
            exit "$code"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "${{ steps.merge_release.outputs.result }}"
          git push origin HEAD:main
          echo "Reverted exact release ${{ steps.merge_release.outputs.result }} after repeated deterministic production-contract failures."
          exit 1

      - name: Preserve production audit evidence
        if: always() && steps.merge_release.outputs.result != ''
        uses: actions/upload-artifact@v4
        with:
          name: content-release-${{ steps.merge_release.outputs.result }}
          path: content-release-audit.log
          if-no-files-found: warn
