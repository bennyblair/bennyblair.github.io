name: Post-deploy content contract report

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: post-deploy-content-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENT_RELEASE_BASE: ${{ github.event.before }}
      CONTENT_RELEASE_AUDIT_ATTEMPTS: "8"
      CONTENT_RELEASE_AUDIT_DELAY_MS: "45000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit every added or repaired production page
        id: release_audit
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run audit:live:content-release 2>&1 | tee content-release-audit.log
          code=$?
          set -e
          if [[ "$code" == "0" ]]; then
            echo "classification=passed" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == "10" ]]; then
            echo "classification=deterministic_content_defect" >> "$GITHUB_OUTPUT"
            exit "$code"
          else
            echo "classification=infrastructure_or_deploy_unknown" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
      # The authorized publisher owns rollback under its shared release lock.
      # Generic pushes can contain several commits and are observation-only here.
      - name: Preserve production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-content-${{ github.sha }}
          path: content-release-audit.log
          if-no-files-found: warn
