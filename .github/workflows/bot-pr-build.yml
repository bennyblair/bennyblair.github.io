name: Website quality gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type, content, security, build and route checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRERENDER_CONCURRENCY: "10"
      CONTENT_QA_BASE: origin/main
      SEO_MAX_ALLOWED_RISK: ${{ startsWith(github.head_ref, 'ai/daily-content-') && 'R2' || 'R3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm test

      - name: SEO control-plane registry and lifecycle gate
        run: npm run qa:seo-control-plane

      - name: New-page business-case gate
        run: npm run qa:seo-new-pages

      - name: Exact automated-content scope and provenance gate
        if: startsWith(github.head_ref, 'ai/daily-content-')
        run: npm run qa:content-automation-scope

      - name: Compute SEO change risk
        run: npm run qa:seo-risk

      - name: Protected indexing-recovery cohort gate
        run: npm run qa:protected-cohort

      - name: Authority claim integrity gate
        run: npm run qa:claims

      - name: Content quality gate
        run: npm run qa:content

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Build, render and crawl every route
        run: npm run build

      - name: Representative accessibility and interaction smoke tests
        run: npm run qa:smoke

      - name: Mobile Lighthouse budgets
        run: npm run qa:lighthouse
