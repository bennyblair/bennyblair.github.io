name: Submit new content to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "src/content/guides/*.md"
      - "src/content/case-studies/*.md"
      - "src/content/insights/*.md"

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect newly added canonical URLs
        id: urls
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=A HEAD~1 HEAD -- \
              'src/content/guides/*.md' \
              'src/content/case-studies/*.md' \
              'src/content/insights/*.md'
          )

          urls=()
          for file in "${files[@]}"; do
            slug="$(basename "$file" .md)"
            case "$file" in
              src/content/guides/*)
                urls+=("https://emetcapital.com.au/resources/guides/$slug")
                ;;
              src/content/case-studies/*)
                urls+=("https://emetcapital.com.au/resources/case-studies/$slug")
                ;;
              src/content/insights/*)
                urls+=("https://emetcapital.com.au/resources/insights/$slug")
                ;;
            esac
          done

          if (( ${#urls[@]} == 0 )); then
            echo "has_urls=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "has_urls=true"
            echo "json=$(printf '%s\n' "${urls[@]}" | jq -R . | jq -cs .)"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "${urls[@]}"

      - name: Submit URLs
        if: steps.urls.outputs.has_urls == 'true'
        env:
          URL_LIST: ${{ steps.urls.outputs.json }}
          INDEXNOW_KEY: "76203180606f4563f8f92955688e3486"
        shell: bash
        run: |
          payload="$(jq -n \
            --arg host "emetcapital.com.au" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://emetcapital.com.au/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"

          status="$(curl --silent --show-error \
            --output /tmp/indexnow-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$payload" \
            "https://api.indexnow.org/indexnow")"

          cat /tmp/indexnow-response.txt
          test "$status" = "200" || test "$status" = "202"
